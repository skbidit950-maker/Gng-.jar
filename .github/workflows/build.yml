
name: Build Survival Helper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract project ZIP
        run: |
          unzip -o SurvivalHelper-Android-CloudBuild.zip -d extracted
          cp -R extracted/. .
          chmod +x gradlew

      - name: Build mod
        run: ./gradlew --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Survival-Helper
          path: build/libs/*.jar
          
